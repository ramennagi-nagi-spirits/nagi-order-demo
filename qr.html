<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAGI 発注システム 画面再現 — QR</title>
<style>
:root{--ink:#111418;--mute:#98A1AE;--line:#E9ECF0;--nagi:#A4133C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',-apple-system,'Hiragino Sans',sans-serif;background:#FAFAFA;color:var(--ink);padding:34px 20px 60px;text-align:center}
h1{font-size:23px;font-weight:900}
.sub{color:var(--mute);font-size:13px;margin:10px 0 26px;line-height:1.9}
.card{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 30px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.qr{display:inline-block}
.qr img,.qr canvas{width:260px;height:260px;image-rendering:pixelated}
.url{margin-top:16px;font-size:12px;color:var(--nagi);word-break:break-all;text-decoration:none;display:block}
.steps{max-width:560px;margin:28px auto 0;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 22px;font-size:13.5px;line-height:2;color:#5B6472}
.steps b{color:var(--ink)}
.note{max-width:560px;margin:16px auto 0;font-size:12px;color:var(--mute);line-height:1.9;text-align:left}
@media print{body{background:#fff;padding:10mm}.steps,.note{display:none}.card{box-shadow:none;border:0}}
</style>
<h1>NAGI 発注システム</h1>
<div class="sub">読み取ると発注の画面が開きます（ログイン不要）。<br>凪ちゃんモデルの店舗は共通で、店舗は画面の店名から選べます。</div>
<div class="card"><div class="qr" id="qr"></div><a class="url" id="u"></a></div>
<div class="steps">
 <b>スマホでアプリのように使う</b><br>
 ① QR を読む → Safari で開く<br>
 ② 共有ボタン → 「ホーム画面に追加」<br>
 ③ 以降はアイコンから全画面で起動します
</div>
<div class="note">操作を覚えるための再現版です。実際の発注は行われません。リロードすると最初から始まります。</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const url=location.href.replace(/qr\.html.*$/,'');
document.getElementById('u').textContent=url; document.getElementById('u').href=url;
new QRCode(document.getElementById('qr'),{text:url,width:260,height:260,correctLevel:QRCode.CorrectLevel.M});
</script>
