<meta charset="utf-8">
<title>NAGI 発注システム 画面再現</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141519">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="NAGI 発注">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#FAFAFA; --panel:#FFF; --ink:#111418; --ink2:#5B6472; --mute:#98A1AE; --line:#E9ECF0; --line2:#DFE3E9;
  --nagi:#A4133C; --nagi2:#7A0E2C; --green:#0F8A5F; --green-bg:#EAF6F1; --amber:#B7791F; --red:#C62828;
  --pink-row:#FDF2F5; --blue:#2563EB; --blue-bg:#EFF4FF;
  --f:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;
  --sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.app{min-height:100dvh;display:flex;flex-direction:column}
/* header */
.top{height:44px;background:#141519;color:#fff;display:flex;align-items:center;gap:14px;padding:0 12px;position:sticky;top:0;z-index:30}
.logo{display:flex;align-items:center;gap:7px;flex:none}
.logo .mk{width:22px;height:22px;border-radius:5px;background:var(--nagi);display:grid;place-items:center;font-size:11px;font-weight:900}
.logo .tx{line-height:1.1}.logo .tx b{font-size:10.5px;letter-spacing:.06em;display:block}.logo .tx span{font-size:7.5px;color:#9AA3B0;letter-spacing:.1em}
.store{display:flex;align-items:center;gap:6px;background:#22242A;border-radius:8px;height:28px;padding:0 10px;font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.store .ic{opacity:.6;font-size:10px}
.steps{flex:1;display:flex;justify-content:center;gap:4px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{height:24px;padding:0 11px;border-radius:12px;font-size:11px;font-weight:700;color:#8C94A2;white-space:nowrap;flex:none}
.steps button.done{color:#C9CFD8}
.steps button.on{background:var(--nagi);color:#fff}
.rgt{display:flex;align-items:center;gap:8px;flex:none;font-size:11px;color:#9AA3B0;white-space:nowrap}
.langs{display:flex;gap:3px}
.langs button{height:26px;padding:0 8px;border-radius:6px;font-size:10.5px;font-weight:700;color:#9AA3B0;display:flex;align-items:center;gap:4px}
.langs button[aria-pressed=true]{background:#fff;color:#141519}
.out{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:#9AA3B0}
/* home */
.wrap{max-width:1060px;margin:0 auto;padding:34px 20px 80px;width:100%}
h1{font-size:26px;font-weight:900;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:12.5px;margin-top:7px}
.hero{margin-top:26px;width:100%;border-radius:14px;background:linear-gradient(135deg,#B0143F,#7C0E2C);color:#fff;height:256px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 26px -14px rgba(124,14,44,.7)}
.hero .pl{font-size:34px;font-weight:300;line-height:1}
.hero .lb{font-size:23px;font-weight:900}
.hd{display:flex;justify-content:space-between;align-items:flex-end}
.ghost{border:1px solid var(--line2);background:#fff;border-radius:8px;height:30px;padding:0 12px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.lab{font-size:11px;color:var(--mute);font-weight:700;margin:26px 0 8px}
.list{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
.list .row{display:flex;align-items:center;gap:12px;padding:16px 18px;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.list .row .ic{width:22px;text-align:center;font-size:16px}
.list .row .nm{font-weight:700;width:74px}
.list .row .ms{flex:1;color:var(--ink2);font-size:13px}
.list .row .st{color:var(--mute);font-size:11.5px}
/* type select */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;text-align:left;transition:.14s;box-shadow:var(--sh)}
.tcard:hover{border-color:#C9D0DA}
.tcard.on{border-color:var(--green);box-shadow:0 0 0 1px var(--green),var(--sh)}
.tcard.off{opacity:.55;cursor:not-allowed}
.tcard .em{font-size:22px}
.tcard h3{font-size:19px;font-weight:900;margin:12px 0 8px}
.tcard p{color:var(--mute);font-size:12px;line-height:1.75}
.pillg{margin-top:14px;display:inline-flex;align-items:center;gap:6px;background:#0E7A55;color:#fff;border-radius:7px;height:30px;padding:0 13px;font-size:12px;font-weight:700}
.pillx{margin-top:14px;display:inline-flex;align-items:center;background:#F1F3F6;color:var(--mute);border-radius:7px;height:30px;padding:0 13px;font-size:12px;font-weight:700}
.note{margin-top:22px;background:#F2F9F5;border:1px solid #DAEEE4;border-radius:10px;padding:14px 16px;font-size:12px;line-height:1.9}
.note b{font-weight:700}
.back{margin-top:22px;color:var(--ink2);font-size:12.5px}
/* input layout */
.split{display:flex;min-height:calc(100dvh - 44px)}
.side{width:176px;flex:none;border-right:1px solid var(--line);background:#FBFBFC;padding:14px 0}
.side .h{font-size:10.5px;color:var(--mute);font-weight:700;padding:0 14px 10px}
.sup{display:flex;align-items:center;gap:9px;padding:9px 12px;width:100%;text-align:left;border-left:3px solid transparent}
.sup.on{background:#FDF2F5;border-left-color:var(--nagi)}
.sup .av{width:22px;height:22px;border-radius:5px;background:#EDEFF3;display:grid;place-items:center;font-size:12px;flex:none;overflow:hidden}
.sup .m{flex:1;min-width:0}
.sup .m b{display:block;font-size:12px;font-weight:700}
.sup.on .m b{color:var(--nagi)}
.sup .m span{font-size:10.5px;color:var(--mute)}
.dot{width:17px;height:17px;border-radius:50%;background:#E2E5EA;flex:none;display:grid;place-items:center;font-size:10px;color:#fff;font-weight:700}
.dot.n{background:var(--nagi)}.dot.ok{background:#16A34A}
.main{flex:1;min-width:0;padding:22px 20px 110px;display:flex;flex-direction:column;align-items:center}
.mhead{width:min(100%,540px);display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.mhead .av{width:34px;height:34px;border-radius:8px;background:#EDEFF3;display:grid;place-items:center;font-size:17px;flex:none}
.mhead h2{font-size:19px;font-weight:900}
.mhead .s{font-size:11.5px;color:var(--mute);margin-top:4px}
.mhead .r{margin-left:auto;text-align:right}
.cnt{background:#F1F3F6;border-radius:7px;padding:2px 9px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.guest{width:min(100%,540px);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2);margin-bottom:14px}
.guest b{font-size:17px;font-weight:900;color:var(--green)}
.item{width:min(100%,540px);background:#fff;border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden;box-shadow:var(--sh)}
.item.act{border-color:#CBD5E1}
.itop{display:flex;gap:13px;padding:14px}
.ph{width:70px;height:56px;border-radius:7px;background:#EDEFF3;flex:none;display:grid;place-items:center;font-size:22px;overflow:hidden}
.iname{font-size:15.5px;font-weight:900;letter-spacing:-.01em}
.imeta{font-size:12px;color:var(--ink2);margin-top:5px}
.imeta b{font-weight:900;color:var(--ink)}
.next-d{font-size:11.5px;color:#8A6A2B;margin-top:5px}
.ibody{padding:0 14px 12px}
.ctl{display:flex;align-items:center;gap:9px;padding:6px 0 12px}
.ctl .lb{font-size:12.5px;color:var(--ink2);flex:1}
.stp{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:#fff;font-size:16px;color:var(--ink2);display:grid;place-items:center}
.stp:active{background:#F1F3F6}
.qty{width:63px;height:40px;border:2px solid var(--line2);border-radius:9px;text-align:center;font-size:19px;font-weight:900;color:var(--ink);background:#fff;font-family:var(--f)}
.qty.set{border-color:var(--green)}
.qty::-webkit-outer-spin-button,.qty::-webkit-inner-spin-button{-webkit-appearance:none}
.unit{font-size:12px;color:var(--ink2);width:26px}
.rail{position:relative;padding:2px 0 0}
input[type=range]{width:100%;-webkit-appearance:none;background:transparent;height:22px}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--green) var(--p,0%),#E7EAEE var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:#fff;border:2px solid var(--green);margin-top:-6.5px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.ticks{position:relative;height:4px}
.ticks i{position:absolute;top:0;width:3px;height:3px;border-radius:50%;background:#C7CDD6;transform:translateX(-50%)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:2px}
.est{text-align:right;font-size:11px;color:var(--ink2);margin-top:6px}
.est b{font-weight:900;color:var(--ink)}
.tag{font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:4px}
.tag.ok{background:#E9F7EF;color:#0F7A46}.tag.warn{background:#FEF6E7;color:#9A6B12}.tag.bad{background:#FDEDED;color:#B3261E}
.foot{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--pink-row);border-top:1px solid #F5E4E9}
.foot .l{font-size:12.5px;color:var(--ink2)}
.foot .v{font-size:23px;font-weight:900;color:var(--nagi)}
.foot .v small{font-size:12px;margin-left:2px}
.foot .x{font-size:11.5px;color:var(--ink2);margin-left:7px}
.foot.zero{background:#fff;border-top:1px solid var(--line)}
.foot.zero .v{color:var(--mute);font-size:13px;font-weight:700}
.bottom{position:fixed;left:176px;right:0;bottom:0;background:rgba(250,250,250,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:12px;justify-content:center;z-index:20}
.bottom .in{display:flex;gap:12px;width:min(100%,900px)}
.btn{height:46px;border-radius:10px;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.btn.sec{width:64px;background:#22242A;color:#fff}
.btn.pri{flex:1;background:#1B1E24;color:#fff}
.btn.pri:disabled{background:#E7EAEE;color:#A8B0BB;cursor:not-allowed}
/* confirm */
.cwrap{max-width:1000px;margin:0 auto;padding:20px 20px 120px}
.alert{background:#F2F9F5;border:1px solid #DAEEE4;border-radius:9px;padding:11px 14px;font-size:12px;font-weight:700;color:#1B5E20;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center;box-shadow:var(--sh)}
.kpi.blue{background:var(--blue-bg);border-color:#D8E3FB}
.kpi .k{font-size:11.5px;color:var(--ink2);font-weight:700}
.kpi .v{font-size:27px;font-weight:900;margin:4px 0 2px}
.kpi.blue .v{color:var(--blue)}
.kpi .u{font-size:11px;color:var(--mute)}
.grp{background:#fff;border:1px solid var(--line);border-radius:11px;margin-bottom:16px;overflow:hidden;box-shadow:var(--sh)}
.ghead{display:flex;align-items:center;gap:10px;padding:13px 15px}
.ghead .av{width:26px;height:26px;border-radius:6px;background:#EDEFF3;display:grid;place-items:center;font-size:14px}
.ghead b{font-size:14px;font-weight:900}
.ghead .c{font-size:11px;color:var(--mute);margin-top:2px}
.ghead .chg{margin-left:auto;font-size:11px;font-weight:700;color:var(--amber);background:#FEF6E7;border-radius:5px;padding:3px 8px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--mute);font-weight:700;text-align:left;padding:8px 10px;background:#FBFBFC;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
th.c,td.c{text-align:center}
td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
td.nm{display:flex;align-items:center;gap:10px;font-weight:700}
td.nm .th{width:28px;height:28px;border-radius:5px;background:#EDEFF3;display:grid;place-items:center;font-size:14px;flex:none}
.stock{font-weight:900}.stock small{font-weight:400;color:var(--mute);margin-left:2px}
.ai{display:inline-block;min-width:34px;background:var(--blue-bg);color:var(--blue);border-radius:6px;padding:3px 8px;font-weight:900;font-size:13px}
.qcell{display:flex;align-items:center;justify-content:center;gap:5px}
.mini{width:26px;height:26px;border-radius:6px;border:1px solid var(--line2);background:#fff;color:var(--ink2);display:grid;place-items:center;font-size:14px}
.fin{width:52px;height:30px;border:1px solid var(--line2);border-radius:7px;text-align:center;font-size:14px;font-weight:700;background:#fff;font-family:var(--f)}
.fin.chg{border-color:#E8B84B;background:#FFFCF3;color:#8A6200}
.gfoot{display:flex;justify-content:space-between;padding:10px 15px;font-size:11.5px;color:var(--mute)}
.gfoot .r{font-weight:700;color:var(--amber)}
.gfoot .r.same{color:var(--mute);font-weight:400}
.cbar{position:fixed;left:0;right:0;bottom:0;background:rgba(250,250,250,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:14px 20px}
.cbar .in{max-width:1000px;margin:0 auto}
.saveln{display:flex;align-items:center;gap:10px;background:#F3F4F6;border-radius:9px;padding:11px 14px;font-size:12px;color:var(--ink2);margin-bottom:12px}
.saveln .b{margin-left:auto;background:#fff;border:1px solid var(--line2);border-radius:7px;height:32px;padding:0 13px;font-size:11.5px;font-weight:700}
.crow{display:flex;align-items:center;gap:14px}
.crow .back2{border:1px solid var(--line2);background:#fff;border-radius:9px;height:44px;padding:0 22px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.crow .msg{flex:1;text-align:right;font-size:11.5px;color:var(--green);font-weight:700}
.submit{background:#141519;color:#fff;border-radius:9px;height:46px;padding:0 22px;font-size:14px;font-weight:900;display:flex;align-items:center;gap:7px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:120px;background:#141519;color:#fff;border-radius:10px;padding:13px 20px;font-size:13.5px;font-weight:700;z-index:60;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.done-w{max-width:520px;margin:70px auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:40px 28px;box-shadow:var(--sh)}
.done-w .ck{width:62px;height:62px;border-radius:50%;background:#E9F7EF;color:#0F7A46;font-size:30px;display:grid;place-items:center;margin:0 auto 18px}
.done-w h2{font-size:21px;font-weight:900}
.done-w p{color:var(--ink2);font-size:13px;margin-top:9px;line-height:1.8}
.done-w .btn{margin-top:22px;background:#141519;color:#fff}

@media (max-width:1180px){.rgt>span{display:none}}
@media (max-width:920px){.logo .tx{display:none}.steps button{padding:0 8px}}
@media (max-width:820px){.side{width:112px}.bottom{left:112px}.cards{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.wrap{padding:22px 14px 70px}}
/* ===== スマホ ===== */
@media (max-width:700px){
  .top{height:auto;flex-wrap:wrap;padding:8px 10px;gap:8px;row-gap:8px}
  .logo .tx{display:none}
  .store{font-size:12.5px;height:30px;order:1;flex:1;min-width:0}
  .store span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rgt{order:2;flex:none}
  .steps{order:3;flex:1 0 100%;width:100%;justify-content:flex-start;gap:6px;padding-bottom:2px}
  .steps button{height:26px;font-size:11.5px;padding:0 10px}
  .wrap{padding:18px 14px 40px}
  h1{font-size:21px}
  .hero{height:190px;margin-top:18px}.hero .lb{font-size:20px}
  .list .row{padding:14px;gap:8px}.list .row .nm{width:auto;min-width:52px}.list .row .ms{font-size:12px}
  .cards{grid-template-columns:1fr;gap:12px;margin-top:18px}
  /* 在庫入力: 仕入先は横スクロールのタブへ */
  .split{flex-direction:column;min-height:auto}
  .side{width:100%;border-right:0;border-bottom:1px solid var(--line);padding:8px 0 0;position:sticky;top:0;z-index:15;background:rgba(251,251,252,.97);backdrop-filter:blur(8px)}
  .side .h{display:none}
  .side .row{display:flex;gap:6px;overflow-x:auto;padding:0 10px 8px;scrollbar-width:none}
  .side .row::-webkit-scrollbar{display:none}
  .sup{width:auto;flex:none;border-left:0;border-radius:9px;background:#F1F3F6;padding:7px 10px;gap:7px}
  .sup.on{background:#FDF2F5;box-shadow:inset 0 0 0 1.5px var(--nagi)}
  .sup .m span{display:none}
  .sup .av{width:19px;height:19px;font-size:11px}
  .main{padding:14px 12px 130px}
  .mhead,.guest,.item{width:100%}
  .mhead h2{font-size:17px}
  .itop{padding:12px}.ph{width:58px;height:48px;font-size:19px}
  .iname{font-size:15px}
  .qty{width:70px;height:46px;font-size:20px}
  .stp{width:44px;height:44px;font-size:19px}
  .ctl{gap:8px;padding:4px 0 10px}
  input[type=range]{height:34px}
  input[type=range]::-webkit-slider-thumb{width:26px;height:26px;margin-top:-10px}
  .foot{padding:11px 12px}.foot .v{font-size:21px}
  .bottom{left:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .btn{height:50px}
  /* 確認: 表をカードに */
  .cwrap{padding:14px 12px 210px}
  .kpis{gap:8px}.kpi{padding:11px 6px}.kpi .v{font-size:22px}.kpi .k{font-size:10.5px}
  table,thead,tbody,tr,td{display:block}
  thead{display:none}
  tr{padding:11px 12px;border-bottom:1px solid var(--line)}
  td{border:0;padding:0;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink2)}
  td.nm{display:flex;justify-content:flex-start;font-size:14px;color:var(--ink);margin-bottom:8px;line-height:1.5}
  td.c{justify-content:space-between}
  td[data-l]::before{content:attr(data-l);color:var(--mute);font-size:11.5px;font-weight:700}
  .qcell{gap:8px}.mini{width:36px;height:36px;font-size:16px}.fin{width:60px;height:36px;font-size:15px}
  .cbar{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .saveln{flex-wrap:wrap;font-size:11.5px;padding:10px 12px;gap:8px}
  .saveln .b{margin-left:0;width:100%}
  .crow{flex-wrap:wrap;gap:8px}
  .crow .back2{height:46px;padding:0 16px;font-size:13px}
  .crow .msg{order:3;width:100%;text-align:center;font-size:11px}
  .submit{flex:1;height:50px;justify-content:center}
  .done-w{margin:36px 12px;padding:30px 20px}
}


.veil{position:fixed;inset:0;background:rgba(20,30,60,.3);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:#fff;border-radius:18px 18px 0 0;max-height:80dvh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.grab{width:36px;height:4px;background:#E2E5EA;border-radius:2px;margin:10px auto 0}
.sh-body{padding:14px 18px calc(20px + env(safe-area-inset-bottom))}
.sh-ttl{font-size:17px;font-weight:900;margin-bottom:12px}
.stlist{display:flex;flex-direction:column;gap:8px}
.strow{border:1px solid var(--line2);background:#fff;border-radius:10px;height:50px;padding:0 14px;font-size:14.5px;font-weight:700;text-align:left;color:var(--ink)}

const hp=k=>(HELP[S.lang]&&HELP[S.lang][k])||HELP.JA[k]||'';
function helpFor(el){
 if(el.id==='helpToggle')return hp('helpToggle');
 if(el.closest('.langs'))return hp('lang');
 if(el.closest('.store'))return hp('store');
 if(el.closest('.hero'))return hp('start');
 if(el.closest('.ghost')&&el.closest('.hd'))return hp('yst');
 if(el.closest('.list .row'))return hp('statusRow');
 if(el.closest('.tcard'))return el.classList.contains('off')||el.closest('.tcard').classList.contains('off')?hp('cons'):hp('food');
 if(el.closest('.sup'))return hp('supTab');
 if(el.closest('.guest'))return hp('guests');
 if(el.closest('.stp'))return hp('stepper');
 if(el.closest('.qty'))return hp('qty');
 if(el.type==='range')return hp('slider');
 if(el.closest('.est'))return hp('est');
 if(el.closest('.foot'))return hp('orderRow');
 if(el.closest('.steps'))return hp('stepsNav');
 if(el.closest('.resetbtn'))return hp('reset');
 if(el.closest('.done-w'))return hp('home');
 if(el.closest('.btn.pri'))return hp('nextSup');
 if(el.closest('.btn.sec')||el.closest('.back')||el.closest('.back2'))return hp('back');
 if(el.closest('.kpi'))return hp('kpi');
 if(el.closest('.mini')||el.closest('.fin'))return hp('finalStep');
 if(el.closest('.saveln'))return hp('save');
 if(el.closest('.submit'))return hp('submit');
 return ''}
let helpEl=null,helpTimer=null;
function showHelp(target,sticky){
 const txt=helpFor(target); if(!txt){hideHelp();return}
 if(!helpEl){helpEl=document.createElement('div');helpEl.className='hcall';document.body.appendChild(helpEl)}
 helpEl.innerHTML='<span class="harrow"></span>'+txt.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
 helpEl.hidden=false;
 const r=target.getBoundingClientRect();const w=Math.min(320,window.innerWidth-24);
 let left=Math.max(12,Math.min(r.left,window.innerWidth-w-12));let top=r.bottom+10;
 helpEl.style.width=w+'px';helpEl.style.left=left+'px';helpEl.classList.remove('up');
 if(top+130>window.innerHeight){helpEl.style.top='auto';helpEl.style.bottom=(window.innerHeight-r.top+10)+'px';helpEl.classList.add('up')}
 else{helpEl.style.bottom='auto';helpEl.style.top=top+'px'}
 const ax=Math.max(14,Math.min(r.left+r.width/2-left,w-14));helpEl.querySelector('.harrow').style.left=ax+'px';
 clearTimeout(helpTimer); if(!sticky)helpTimer=setTimeout(hideHelp,3200)}
function hideHelp(){if(helpEl)helpEl.hidden=true}
const HSEL='button,.hero,.tcard,.sup,.qty,input[type=range],.stp,.mini,.fin,.est,.foot,.kpi,.list .row,.guest,.saveln,.langs button';
document.addEventListener('pointerdown',e=>{const el=e.target.closest(HSEL);if(!el||el.closest('.hcall'))return;showHelp(el,false)});
document.addEventListener('pointerover',e=>{if(!HELP_ON)return;const el=e.target.closest(HSEL);if(!el){hideHelp();return}showHelp(el,true)});
document.addEventListener('pointerout',e=>{if(HELP_ON&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest(HSEL)))hideHelp()});
window.addEventListener('scroll',hideHelp,true);

/* ============ 部品 ============ */
function header(){
 const steps=[['home',t('steps')[0]],['type',t('steps')[1]],['input',t('steps')[2]],['confirm',t('steps')[3]]];
 const order=['home','type','input','confirm'];const cur=order.indexOf(S.step==='done'?'confirm':S.step);
 return `<div class="top"><div class="logo"><div class="mk">凪</div><div class="tx"><b>NAGI</b><span>ORDER SYSTEM</span></div></div>
 <button class="store" onclick="S.sheet='store';render()">⌂ <span class="nm">${esc(storeName())}</span> <span class="ic">▾</span></button>
 <div class="steps">${steps.map(([k,l],n)=>`<button class="${k===S.step||(S.step==='done'&&k==='confirm')?'on':n<cur?'done':''}" onclick="goStep('${k}')">${n<cur?'✓ ':''}${l}</button>`).join('')}</div>
 <div class="rgt"><span>${esc(t('dt'))}</span>
 <button class="helpt" id="helpToggle" aria-pressed="${HELP_ON}" onclick="toggleHelp()">?</button>
 <div class="langs">${LANGS.map(([c,f])=>`<button aria-pressed="${S.lang===c}" onclick="setLang('${c}')">${f} ${c}</button>`).join('')}</div></div></div>`;
}

 return `<div class="wrap"><div class="hd"><div><h1>${esc(t('h1'))}</h1><div class="sub">${esc(t('hsub'))}</div></div><button class="ghost" onclick="toast(t('tYst'))">${esc(t('yst'))}</button></div>
 <button class="hero" onclick="goStep('type')"><div class="pl">＋</div><div class="lb">${esc(t('start'))}</div></button>

 <div class="row"><div class="ic">✦</div><div class="nm">${esc(t('cons'))}</div><div class="ms">${esc(t('notyet'))}</div><div class="st">${esc(t('none'))}</div></div></div>

function typeSel(){
 return `<div class="wrap" style="max-width:1000px"><div style="text-align:center"><h1>${esc(t('q1'))}</h1><div class="sub">${esc(t('q1s'))}</div></div>
 <div class="cards"><button class="tcard on" onclick="S.type='food';goStep('input')"><div class="em">🥬</div><h3>${esc(t('food'))}</h3><p>${t('foodDesc')}</p><div class="pillg">⏰ ${esc(t('auto'))}</div></button>
 <div class="tcard off"><div class="em">✦</div><h3 style="color:var(--mute)">${esc(t('cons'))}</h3><p>${t('consDesc')}</p><div class="pillx">${esc(t('noItems'))}</div></div></div>
 <div class="note"><b>${t('timing')}</b><br>${t('timing1')}<br>${t('timing2')}</div>
 <button class="back" onclick="goStep('home')">${esc(t('back'))}</button></div>`;
}
function itemCard(i){
 const it=ITEMS[i];const s=stockOf(i);const on=entered(i);const sug=suggest(i);const r=remain(i);
 const pct=on?Math.min(100,Math.round(s/it.par*100)):0;
 const lv=r?level(r.hours):'';
 const ticks=Array.from({length:Math.max(0,Math.min(11,it.par-1))},(_,k)=>`<i style="left:${(k+1)/it.par*100}%"></i>`).join('');
 return `<div class="item ${on?'act':''}"><div class="itop"><div class="ph">${it.em}</div><div><div class="iname">${esc(itName(it))}</div>
  <div class="imeta">${esc(t('par'))}: <b>${it.par}</b> ${esc(it.u)}</div><div class="next-d">📦 ${esc(t('nextD'))}: 9/8</div></div></div>
 <div class="ibody"><div class="ctl"><div class="lb">${esc(t('stock'))}</div>
  <button class="stp" onclick="bump(${i},-1)">−</button>
  <input class="qty ${on?'set':''}" id="q${i}" inputmode="numeric" value="${on?s:'—'}" onfocus="if(this.value==='—')this.value=''" onchange="setStock(${i},this.value)">
  <button class="stp" onclick="bump(${i},1)">＋</button><div class="unit">${esc(it.u)}</div></div>
 <div class="rail"><input type="range" min="0" max="${it.par}" step="1" value="${on?s:0}" style="--p:${pct}%" oninput="setStock(${i},this.value)">
  <div class="ticks">${ticks}</div><div class="scale"><span>0</span><span>${esc(t('par'))}: ${it.par}</span></div>
  ${r?`<div class="est">${r.portions!==null?`<b>${r.portions}</b>${esc(S.lang==='JA'?it.pl:'')} `:''}${esc(t('left'))} <b>~${r.hours}h</b><span class="tag ${lv}">${lv==='ok'?'✅':lv==='warn'?'⚠️':'🚨'} ${esc(lv==='ok'?t('ok'):lv==='warn'?t('warn'):t('crit'))}</span></div>`:''}</div>
 </div>
 ${on&&sug>0?`<div class="foot"><div class="l">${esc(t('order'))}</div><div><span class="v">${sug}<small> ${esc(it.u)}</small></span>${r&&r.portions!==null?`<span class="x">・${Math.round(sug*it.per)}${esc(S.lang==='JA'?it.pl:'')}</span>`:`<span class="x">・⏰ +${Math.round((sug/it.par)*(it.hrs||24))}h</span>`}</div></div>`
   :on?`<div class="foot zero"><div class="l">${esc(t('order'))}</div><div class="v">✓ 0</div></div>`
   :`<div class="foot zero"><div class="l">${esc(t('order'))}</div><div class="v">${esc(t('stock'))} —</div></div>`}</div>`;
}
function inputView(){
 const sup=SUPPLIERS[S.sup];const idx=idxOf(sup.id);const done=doneSup(sup.id);
 return `<div class="split"><div class="side"><div class="h">${esc(t('supList'))}</div><div class="row">
 ${SUPPLIERS.map((x,n)=>{const c=touchedSup(x.id);const ok=doneSup(x.id);
  return `<button class="sup ${n===S.sup?'on':''}" onclick="S.sup=${n};window.scrollTo(0,0);render()"><div class="av">${x.em}</div><div class="m"><b>${esc(supName(x))}</b><span>${idxOf(x.id).length} ${esc(t('items'))}</span></div><div class="dot ${ok?'ok':c?'n':''}">${ok?'✓':c||''}</div></button>`}).join('')}</div></div>
 <div class="main"><div class="mhead"><div class="av">${sup.em}</div><div><h2>${esc(supName(sup))}</h2><div class="s">${idx.length} ${esc(t('items'))} · ${esc(t('enterStock'))}</div></div>
  <div class="r"><span class="cnt">${S.sup+1} / ${SUPPLIERS.length}</span><div class="s">${esc(t('dt'))}</div></div></div>
 <div class="guest">${esc(t('guests'))} <b>${GUESTS}</b> <button class="ghost" onclick="toast(t('tGuest'))">${esc(t('change'))}</button>
</div>
 ${idx.map(itemCard).join('')}</div>
 <div class="bottom"><div class="in"><button class="btn sec" onclick="prevSup()">${esc(t('backBtn'))}</button>
 <button class="btn pri" ${done?'':'disabled'} onclick="nextSup()">${esc(S.sup<SUPPLIERS.length-1?t('nextSup'):t('toConfirm'))}</button></div></div></div>`;
}
function confirmView(){
 return `<div class="cwrap"><div style="text-align:center;margin-bottom:14px"><h1 style="font-size:22px">${esc(t('c1'))}</h1><div class="sub">${esc(t('c1s'))}</div></div>
 <div class="alert">${esc(t('deadline'))}</div>
 <div class="kpis"><div class="kpi"><div class="k">${esc(t('kOrder'))}</div><div class="v">${orderCount()}</div><div class="u">${esc(t('uItem'))}</div></div>
 <div class="kpi blue"><div class="k">${esc(t('kSup'))}</div><div class="v">${supWithOrder()}</div><div class="u">${esc(t('uSup'))}</div></div>
 <div class="kpi"><div class="k">${esc(t('kMan'))}</div><div class="v">${changedCount()}</div><div class="u">${esc(t('uItem'))}</div></div></div>
 ${SUPPLIERS.map(sp=>{const idx=idxOf(sp.id);const chg=idx.filter(i=>S.final[key(i)]!==undefined&&S.final[key(i)]!==suggest(i)).length;const ord=idx.filter(i=>(finalOf(i)||0)>0).length;
  return `<div class="grp"><div class="ghead"><div class="av">${sp.em}</div><div><b>${esc(supName(sp))}</b><div class="c">${esc(t('cut'))} ${sp.cut}</div></div>${chg?`<span class="chg">${chg} ${esc(t('changed'))}</span>`:''}</div>
  <table><thead><tr><th>${esc(t('thItem'))}</th><th class="c">${esc(t('thStock'))}</th><th class="c">${esc(t('thAi'))}</th><th class="c">${esc(t('thFinal'))}</th><th class="c">${esc(t('thUnit'))}</th></tr></thead><tbody>
  ${idx.map(i=>{const it=ITEMS[i];const f=finalOf(i)||0;const ch=S.final[key(i)]!==undefined&&S.final[key(i)]!==suggest(i);
   return `<tr><td class="nm"><div class="th">${it.em}</div>${esc(itName(it))}</td>
   <td class="c" data-l="${esc(t('thStock'))}"><span class="stock">${entered(i)?stockOf(i):'—'}<small>${esc(it.u)}</small></span></td>
   <td class="c" data-l="${esc(t('thAi'))}"><span class="ai">${suggest(i)??'—'}</span></td>
   <td class="c" data-l="${esc(t('thFinal'))}"><div class="qcell"><button class="mini" onclick="bumpFinal(${i},-1)">−</button><input class="fin ${ch?'chg':''}" inputmode="numeric" value="${f}" onchange="setFinal(${i},this.value)"><button class="mini" onclick="bumpFinal(${i},1)">＋</button></div></td>
   <td class="c" data-l="${esc(t('thUnit'))}" style="color:var(--ink2)">${esc(it.u)}</td></tr>`}).join('')}
  </tbody></table><div class="gfoot"><span>${esc(t('nOrdered',ord))}</span><span class="r ${chg?'':'same'}">${esc(chg?t('nChanged',chg):t('asSug'))}</span></div></div>`}).join('')}
 </div>
 <div class="cbar"><div class="in"><div class="saveln">${esc(t('saveHint'))}<button class="b" onclick="toast(t('tSaved'))">${esc(t('saveBtn'))}</button></div>

}
function doneView(){
 return `<div class="done-w"><div class="ck">✓</div><h2>${esc(t('doneT'))}</h2>

/* ============ 操作 ============ */
function goStep(k){if(k==='input'&&!S.type)S.type='food';if(k==='confirm'&&!allDone()){toast(t('tNeed'));return}S.step=k;window.scrollTo(0,0);render()}
function setStock(i,v){const it=ITEMS[i];let n=parseInt(String(v).replace(/[^0-9]/g,''),10);if(isNaN(n))n=0;n=Math.max(0,Math.min(it.par,n));S.stock[key(i)]=n;delete S.final[key(i)];render()}
function bump(i,d){const cur=entered(i)?stockOf(i):0;setStock(i,cur+d)}
function setFinal(i,v){let n=parseInt(String(v).replace(/[^0-9]/g,''),10);if(isNaN(n))n=0;S.final[key(i)]=Math.max(0,n);render()}
function bumpFinal(i,d){setFinal(i,(finalOf(i)||0)+d)}
function nextSup(){if(S.sup<SUPPLIERS.length-1){S.sup++;window.scrollTo(0,0);render()}else goStep('confirm')}
function prevSup(){if(S.sup>0){S.sup--;window.scrollTo(0,0);render()}else goStep('type')}
function resetAll(){if(!confirm(t('resetAsk')))return;S.stock={};S.final={};S.submitted=false;S.type=null;S.sup=0;S.step='home';window.scrollTo(0,0);render();toast(t('resetDone'))}
function submitOrder(){S.submitted=true;S.step='done';window.scrollTo(0,0);render();}
function storeSheet(){return `<div class="veil" onclick="if(event.target===this){S.sheet=null;render()}"><div class="sheet"><div class="grab"></div><div class="sh-body">
 <div class="sh-ttl">${esc(t('pickStore'))}</div>
 <div class="stlist">${STORES.map(x=>`<button class="strow ${x.id===STORE_OBJ.id?'on':''}" onclick="pickStoreId('${x.id}')">${esc(S.lang==='JA'?x.ja:x.en)}${x.id===STORE_OBJ.id?' ✓':''}</button>`).join('')}</div>
 </div></div></div>`}
function pickStoreId(id){localStorage.setItem('nagi_store',id);const u=new URL(location.href);u.searchParams.set('store',id);location.href=u.toString()}
function render(){$('app').innerHTML=header()+(S.step==='home'?home():S.step==='type'?typeSel():S.step==='input'?inputView():S.step==='confirm'?confirmView():doneView())+(S.sheet==='store'?storeSheet():'');
 document.querySelectorAll('input[type=range]').forEach(r=>{const set=()=>r.style.setProperty('--p',(r.value/r.max*100)+'%');set();r.addEventListener('input',set)})}
Object.assign(window,{toggleHelp,showHelp,hideHelp,resetAll,goStep,setStock,bump,setFinal,bumpFinal,nextSup,prevSup,submitOrder,render,S,toast,setLang,pickStoreId,t});
render();
